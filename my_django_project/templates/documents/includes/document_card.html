<article class="card doc-card mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h2 class="h5 card-title mb-1">
                    <a href="{% url 'documents:detail' doc.id %}" class="text-decoration-none fw-bold">
                        #{{ doc.id }} {{ doc.title|default:"Без названия" }}
                    </a>
                </h2>
                <div class="mt-2">
                    {% if doc.categories %}
                        {% for cat in doc.categories %}
                        <span class="badge bg-info text-dark category-badge me-1">{{ cat.name }}</span>
                        {% endfor %}
                    {% else %}
                        <span class="badge bg-light text-muted border category-badge">Без категорий</span>
                    {% endif %}
                </div>
            </div>
            <a href="{% url 'documents:detail' doc.id %}" class="btn btn-sm btn-primary">
                Подробнее
            </a>
        </div>
    </div>
</article>
