{% extends "base.html" %}

{% block title %}404 – Страница не найдена – DocFlow{% endblock %}

{% block content %}
<div class="card border-danger shadow-sm my-4">
    <div class="card-body text-center py-5">
        <h1 class="text-danger display-4 fw-bold mb-3">404 – Страница не найдена</h1>
        <p class="lead text-muted mb-4">
            {{ message|default:"Запрашиваемый ресурс, документ, категория или версия не существуют." }}
        </p>
        <a href="{% url 'homepage:index' %}" class="btn btn-primary px-4">← На главную</a>
    </div>
</div>
{% endblock %}
