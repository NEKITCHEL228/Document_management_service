<article class="card doc-card mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h2 class="h5 card-title mb-1">
                    <a href="{% url 'categories:detail' category.id %}" class="text-decoration-none fw-bold">
                        #{{ category.id }} {{ category.name|default:"Без названия" }}
                    </a>
                </h2>
                <p class="card-text text-muted small mt-2 mb-0">
                    {{ category.description|default:"Описание отсутствует" }}
                </p>
            </div>
            <a href="{% url 'categories:detail' category.id %}" class="btn btn-sm btn-outline-primary">
                Подробнее
            </a>
        </div>
    </div>
</article>
